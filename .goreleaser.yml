version: 2

before:
  hooks:
    - sh -c "cd web && bun install --frozen-lockfile"
    - sh -c "cd web && bun run build"
    - go mod tidy

builds:
  - id: "beeteams" # 内部标识符
    binary: "beeteams" # 决定了生成的文件名是 beeteams (Windows 下自动加 .exe)
    env:
      - CGO_ENABLED=0
    main: ./cmd/fkteams
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'fkteams/internal/app/version.version={{.Version}}'
      - -X 'fkteams/internal/app/version.buildTime={{.Date}}'
    flags:
      - -trimpath

archives:
  - formats: ["zip"]
    name_template: >-
      beeteams_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
